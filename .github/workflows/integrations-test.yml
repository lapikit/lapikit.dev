name: CI Tests

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create .env file
        run: cp .env.example .env

      - name: Type check
        run: bun run check

      - name: Lint and format
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create .env file
        run: cp .env.example .env

      - name: Build
        run: bun run build

      - name: Check performance budget
        run: bun run check-budget

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate content manifest
        run: bun run sync-content

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: build/

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run e2e tests
        run: bun run test:e2e

      # report only: visible on the run summary page, never blocks the pipeline
      - name: Accessibility report
        run: bun run test:a11y
        continue-on-error: true
