name: Deploy

on:
  workflow_call:
    inputs:
      path-secret:
        description: Name of the secret holding the folder on the VPS (PATH_CURRENT, PATH_INSIDER, PATH_CANARY)
        required: true
        type: string
      ref:
        description: Branch to deploy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.path-secret }}
      cancel-in-progress: false

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/${{ secrets[inputs.path-secret] }}
            git fetch origin
            git reset --hard origin/${{ inputs.ref }}
            bash scripts/deploy/deploy.sh
