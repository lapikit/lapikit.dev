name: Deploy

# The CI connects as the lapikit account, whose key can only run "deploy <env> [branch]":
# the VPS syncs the repository itself and deploys (see /usr/local/bin/lapikit-deploy).

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy (current, insider)
        required: true
        type: string
      ref:
        description: Branch to deploy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: deploy ${{ inputs.environment }} ${{ inputs.ref }}
